<form [formGroup]="reservationForm" (ngSubmit)="onSubmit()">
    
    <div>
        <label for="checkInDate">Check-In Date:</label>
        <input type ="date" formControlName="checkInDate">
        <div *ngIf="reservationForm.get('checkInDate')?.invalid && reservationForm.get('checkInDate')?.touched" class="alert alert-danger">
            Check-In Date is required.
        </div>
    </div>

    <div>
        <label for="checkOutDate">Check-Out Date:</label>
        <input type ="date" formControlName="checkOutDate">
        <div *ngIf="reservationForm.get('checkOutDate')?.invalid && reservationForm.get('checkOutDate')?.touched" class="alert alert-danger">
            Check-Out Date is required.
        </div>
    </div>

    <div>
        <label for="guestName">Guest Name:</label>
        <input type ="text" formControlName="guestName">
        <div *ngIf="reservationForm.get('guestName')?.invalid && reservationForm.get('guestName')?.touched" class="alert alert-danger">
            Guest Name is required.
        </div>
    </div>

    <div>
        <label for="guestEmail">Email:</label>
        <input type ="email" formControlName="guestEmail">
        <div *ngIf="reservationForm.get('guestEmail')?.invalid && reservationForm.get('guestEmail')?.touched" class="alert alert-danger">
            Email is required.
        </div>
    </div>
    
    <div>
        <label for="roomNumber">Room Number:</label>
        <input type ="number" formControlName="roomNumber">
        <div *ngIf="reservationForm.get('roomNumber')?.invalid && reservationForm.get('roomNumber')?.touched" class="alert alert-danger">
            Room Number is required.
        </div>
    </div>

    <button type="submit" [disabled]="reservationForm.invalid">Submit</button>
</form>
