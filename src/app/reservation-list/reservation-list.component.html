<h2>Reservation List</h2>
<ul *ngIf="reservations.length > 0; else noReservation">
  <li *ngFor="let reservation of reservations">
    Guest Name: {{ reservation.guestName }} <br> 
    Guest Email: {{ reservation.guestEmail }} <br>
    Check-in Date: {{reservation.checkInDate | date }} <br>
    Check-out Date: {{reservation.checkOutDate | date }} <br>
    Room Number: {{ reservation.roomNumber }} <br>
  </li>
</ul>

<ng-template #noReservation>
  <p>No reservation available.</p>
</ng-template>
